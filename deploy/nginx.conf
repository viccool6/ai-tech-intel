# nginx server block: reverse-proxy the gunicorn app on 127.0.0.1:5000,
# gate the site with HTTP Basic Auth. Only listens on port 80 — TLS is
# out of scope here (add certbot separately if the domain is public).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ai-tech-intel
#   sudo ln -s /etc/nginx/sites-available/ai-tech-intel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Create the password file (once):
#   sudo apt install apache2-utils          # for htpasswd
#   sudo htpasswd -c /etc/nginx/.htpasswd-ai-tech-intel <USERNAME>
# Add more users later (drop the -c):
#   sudo htpasswd /etc/nginx/.htpasswd-ai-tech-intel <ANOTHER_USER>

server {
    # default_server + server_name _ means "answer any Host header on port 80"
    # — works for direct IP access with no domain. When you later have a
    # domain:
    #   1) drop `default_server` from listen (or move it to a different block)
    #   2) change `server_name _;` to `server_name your.example.com;`
    #   3) add certbot for TLS: `sudo certbot --nginx -d your.example.com`
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/ai-tech-intel.access.log;
    error_log  /var/log/nginx/ai-tech-intel.error.log warn;

    # Site-wide Basic Auth. Nothing here should be public.
    auth_basic           "AI Tech Intel — restricted";
    auth_basic_user_file /etc/nginx/.htpasswd-ai-tech-intel;

    # App traffic → gunicorn.
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # This app never accepts uploads; keep the default tight to blunt any
    # oddball request that might sneak past Basic Auth.
    client_max_body_size 1m;

    # Cheap hardening headers — safe defaults for a private tool.
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff"    always;
    add_header Referrer-Policy            "no-referrer" always;
}
